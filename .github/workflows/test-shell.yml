# パターン2: 最初に shell で「md 以外の変更があるか」を判定し、テストのジョブを if でスキップする
# md だけのコミットでも、このワークフローは起動し、結果は success になる
name: test (shell)

on:
  pull_request:
    branches: [main]
  push:  # main へのマージ
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          # PR: ベースブランチの先端と比較 / マージ（push）: マージ前の main の先端と比較
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          echo "--- 変更ファイル ---"
          git diff --name-only "$BEFORE" "$AFTER" || true
          if git diff --quiet "$BEFORE" "$AFTER" -- . ':(exclude)*.md'; then
            echo "md だけの変更 → テストをスキップ"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "md 以外の変更あり（または判定できない）→ テストを実行"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_app.py
