# マトリクス + 集約ジョブ（gate）
# 確認したいこと:
#   - 必須チェックを「07 ci-ok」だけにしたとき、md だけの PR がマージ可能になるか
#   - テストが失敗した PR で「07 ci-ok」が失敗になるか（素通りしないか）
name: 07 matrix gate

on:
  pull_request:

jobs:
  changes:
    name: 07 changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- . ':(exclude)*.md' ':(exclude)docs/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 07 test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        variant: [a, b]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash test/test.sh

  ci-ok:
    name: 07 ci-ok
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
          HAS_ERROR: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$NEEDS"
          if [[ "$HAS_ERROR" == "true" ]]; then
            echo "失敗またはキャンセルされたジョブがあります"
            exit 1
          fi
          echo "OK"
