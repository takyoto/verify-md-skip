# パターン②-c: dorny/paths-filter で判定
# 確認したいこと: predicate-quantifier: 'every' で「md でも docs でもないファイルがあれば true」になるか
# 注意: 本番ではタグではなくコミット SHA で固定すること（検証用なのでタグのまま）
name: 05 paths-filter

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 05 changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
      - run: echo "code=${{ steps.filter.outputs.code }}"

  test:
    name: 05 test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/test.sh
