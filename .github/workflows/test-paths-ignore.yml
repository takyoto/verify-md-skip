# パターン1: paths-ignore でワークフローごとスキップする
# md だけのコミットでは、このワークフローは起動しない（＝結果が残らない）
name: test (paths-ignore)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:  # main へのマージ
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_app.py
