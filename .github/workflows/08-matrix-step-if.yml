# 比較用: マトリクスでステップごとに if 判定（ジョブは全部起動する）
# 確認したいこと: md だけの PR でも全ランナーが起動し、どれくらい時間（課金分数）を消費するか
name: 08 matrix step-if

on:
  pull_request:

jobs:
  test:
    name: 08 test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        variant: [a, b]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- . ':(exclude)*.md' ':(exclude)docs/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.code == 'true'
        run: bash test/test.sh
