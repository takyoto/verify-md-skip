# パターン②-a: git diff + pathspec の :(exclude) で判定（三点 diff, fetch-depth: 0）
# 確認したいこと:
#   - md だけの PR で test が skipped になり、必須チェック「02 test」が満たされるか
#   - ':(exclude)*.md' がサブディレクトリの md にも効くか
name: 02 git-diff pathspec

on:
  pull_request:

jobs:
  changes:
    name: 02 changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "--- 変更ファイル（三点 diff）---"
          git diff --name-only "$BASE_SHA"...HEAD
          echo "--- md / docs を除外した変更ファイル ---"
          git diff --name-only "$BASE_SHA"...HEAD -- . ':(exclude)*.md' ':(exclude)docs/**'
          if git diff --quiet "$BASE_SHA"...HEAD -- . ':(exclude)*.md' ':(exclude)docs/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 02 test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/test.sh
