# パターン②-b: gh pr diff --name-only で判定（checkout なし）
# 確認したいこと: checkout なしで判定できるか、02 と同じ結果になるか
name: 04 gh pr diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 04 changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "--- 変更ファイル ---"
          echo "$files"
          if echo "$files" | grep -qvE '\.md$|^docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 04 test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/test.sh
